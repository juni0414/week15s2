name: wf-ci-development
on:
  push:
    branches:
      - develop
jobs:
  ci-development-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: Lint Html and CSS
        run: |
            npx htmlhint "**/*.html"
            npx stylelint "**/*.css"
      - name: Test build ops
        run: |
            npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"